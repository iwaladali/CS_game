<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>CS Rock Paper Scissors</title>
<style>
body{margin:0;background:#0f172a;color:#e2e8f0;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;padding:12px;gap:8px}
canvas{width:min(96vw,calc(92vh*1.333));border-radius:12px;background:#000}
select{padding:6px;border-radius:6px}
</style></head><body>
<canvas id="cv" width="800" height="600"></canvas>
<div><small>Camera: </small><select id="camSel"></select> <small id="err" style="color:#f87171"></small></div>
<video id="vid" playsinline muted style="display:none"></video>
<script src="mediapipe/hands.js"></script>
<script>
const W=800,H=600,cv=document.getElementById('cv'),c=cv.getContext('2d');
const vid=document.getElementById('vid'),sel=document.getElementById('camSel'),err=document.getElementById('err');
const EM={rock:'✊',paper:'✋',scissors:'✌️'},BEATS={rock:'scissors',scissors:'paper',paper:'rock'};
const CONN=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[17,18],[18,19],[19,20],[0,17]];
const WIN=3;
let phase='wait',t0=0,bothSince=null,scores=[0,0],samples=[[],[]],picks=[null,null],msg='',champ=-1;

// open finger = tip farther from wrist than the pip joint
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y);}
function isOpen(lm,tip,pip){return dist(lm[tip],lm[0])>dist(lm[pip],lm[0])*1.1;}
function gesture(lm){
  const o=[isOpen(lm,8,6),isOpen(lm,12,10),isOpen(lm,16,14),isOpen(lm,20,18)];
  const n=o.filter(Boolean).length;
  if(n===0)return 'rock';
  if(n===4)return 'paper';
  if(o[0]&&o[1]&&!o[2]&&!o[3])return 'scissors';
  return null;
}
function mode(a){const m={};a.forEach(x=>m[x]=(m[x]||0)+1);let b=null,k=0;for(const x in m)if(m[x]>k){k=m[x];b=x;}return b;}

function text(s,x,y,size,color='#fff'){c.font='bold '+size+'px system-ui';c.textAlign='center';c.lineWidth=6;c.strokeStyle='#000';c.strokeText(s,x,y);c.fillStyle=color;c.fillText(s,x,y);}

function onResults(r){
  const now=performance.now();
  c.save();c.translate(W,0);c.scale(-1,1);c.drawImage(vid,0,0,W,H);c.restore();
  c.fillStyle='rgba(0,0,0,.25)';c.fillRect(0,0,W,H);
  c.strokeStyle='rgba(255,255,255,.5)';c.setLineDash([10,10]);c.beginPath();c.moveTo(W/2,0);c.lineTo(W/2,H);c.stroke();c.setLineDash([]);

  // assign hands to players by screen side (mirrored)
  let hs=(r.multiHandLandmarks||[]).map(lm=>({lm,x:1-lm[0].x})).sort((a,b)=>a.x-b.x);
  const pl=[null,null];
  if(hs.length>=2){pl[0]=hs[0];pl[1]=hs[1];}
  else if(hs.length===1){pl[hs[0].x<0.5?0:1]=hs[0];}
  const cur=pl.map(h=>h?gesture(h.lm):null);
  pl.forEach((h,i)=>{if(!h)return;
    const P=k=>[(1-h.lm[k].x)*W,h.lm[k].y*H];
    c.strokeStyle=i?'#f472b6':'#38bdf8';c.lineWidth=3;
    CONN.forEach(([a,b])=>{c.beginPath();c.moveTo(...P(a));c.lineTo(...P(b));c.stroke();});
  });

  // state machine
  const both=pl[0]&&pl[1];
  if(phase==='wait'){
    if(both){bothSince??=now;if(now-bothSince>1000){phase='count';t0=now;samples=[[],[]];}}else bothSince=null;
    text('Show both hands ✋ ✋',W/2,H/2,44);
    text('First to '+WIN+' wins',W/2,H/2+50,26,'#facc15');
  }else if(phase==='count'){
    const e=now-t0,n=3-Math.floor(e/800);
    if(n<=0){phase='shoot';t0=now;}else text(n,W/2,H/2+40,160);
  }
  if(phase==='shoot'){
    const e=now-t0;
    text('SHOOT!',W/2,H/2+30,90,'#facc15');
    if(e>200)cur.forEach((g,i)=>{if(g)samples[i].push(g);});
    if(e>1000){
      picks=[mode(samples[0]),mode(samples[1])];
      if(!picks[0]||!picks[1])msg='Not clear — try again!';
      else if(picks[0]===picks[1])msg='Draw!';
      else{const w=BEATS[picks[0]]===picks[1]?0:1;scores[w]++;msg='Player '+(w+1)+' wins the round!';
        if(scores[w]>=WIN){champ=w;}}
      phase='result';t0=now;
    }
  }else if(phase==='result'){
    const e=now-t0;
    text(picks[0]?EM[picks[0]]:'❓',W*0.25,H/2,130);text(picks[1]?EM[picks[1]]:'❓',W*0.75,H/2,130);
    text(msg,W/2,H-90,40,'#facc15');
    if(e>2600){if(champ>=0){phase='final';t0=now;}else{phase='wait';bothSince=null;}}
  }else if(phase==='final'){
    text('🏆 Player '+(champ+1)+' is the champion!',W/2,H/2,48,'#facc15');
    if(now-t0>4000){scores=[0,0];champ=-1;phase='wait';bothSince=null;}
  }

  // live gesture + HUD
  if(phase==='wait'||phase==='count'||phase==='shoot')
    cur.forEach((g,i)=>text(g?EM[g]:'',W*(i?0.75:0.25),H-40,60));
  text('P1',W*0.25,50,36,'#38bdf8');text('P2',W*0.75,50,36,'#f472b6');
  text(scores[0],W*0.25,100,48);text(scores[1],W*0.75,100,48);
}

async function startCam(id){
  if(location.protocol==='file:'){err.textContent='Open via start.bat / start.sh, not file://';return;}
  if(vid.srcObject)vid.srcObject.getTracks().forEach(t=>t.stop());
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:id?{deviceId:{exact:id},width:800,height:600}:{width:800,height:600}});
    vid.srcObject=s;await vid.play();err.textContent='';
    const devs=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');
    const cur=s.getVideoTracks()[0].getSettings().deviceId;
    sel.innerHTML=devs.map((d,i)=>`<option value="${d.deviceId}" ${d.deviceId===cur?'selected':''}>${d.label||'Camera '+(i+1)}</option>`).join('');
    track();
  }catch(e){err.textContent='Camera error: '+e.name+' — allow access / close other apps using the camera';}
}
let running=false;
async function track(){
  if(running)return;running=true;
  const hands=new Hands({locateFile:f=>'mediapipe/'+f});
  hands.setOptions({maxNumHands:2,modelComplexity:0,minDetectionConfidence:0.6,minTrackingConfidence:0.5});
  hands.onResults(onResults);
  const tick=async()=>{
    if(vid.readyState>=2){try{await hands.send({image:vid});}catch(e){err.textContent='Model error: '+e.message;return;}}
    requestAnimationFrame(tick);
  };
  tick();
}
sel.onchange=()=>startCam(sel.value);
c.fillStyle='#000';c.fillRect(0,0,W,H);text('Starting camera…',W/2,H/2,40);
startCam();
</script></body></html>
